name: Frontend CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Vue 3 / Vite build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Check production bundle
        run: npm run build
